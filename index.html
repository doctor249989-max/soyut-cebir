<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Soyut Cebir I</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#18202a" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="ikon-192.png"><link rel="apple-touch-icon" href="ikon-180.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Soyut Cebir">
<meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#f1f4f7;--surface:#fff;--fg:#15202c;--muted:#566475;--line:#d3dae2;--accent:#1d4f8f;--accent-fg:#fff;--bad:#b3372f;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f141a;--surface:#18202a;--fg:#e7ecf2;--muted:#9ba8b7;--line:#2d3845;--accent:#86b4f2;--accent-fg:#0c1a2c;--bad:#e48a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px 20px}
h1{font:600 1.6rem/1.15 "Cambria Math",Cambria,"Times New Roman",serif;margin:0 0 .35rem}
p{margin:0 0 1rem;color:var(--muted)}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:.35rem}
input{width:100%;font:inherit;padding:.7rem .8rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{width:100%;margin-top:.8rem;font:inherit;font-weight:600;padding:.75rem;border:0;border-radius:10px;background:var(--accent);color:var(--accent-fg);cursor:pointer}
button[disabled]{opacity:.6;cursor:default}
#msg{min-height:1.5em;margin:.7rem 0 0;font-size:.92rem;color:var(--bad)}
#ipucu{margin:1rem 0 0;font-size:.85rem;border-top:1px solid var(--line);padding-top:.9rem}
#bekle{color:var(--muted)}
</style></head>
<body>
<p id="bekle">Açılıyor…</p>
<main id="kilit" hidden>
<h1>Soyut Cebir I</h1>
<p>Bu uygulama dersin öğrencilerine açıktır. Devam etmek için size verilen şifreyi girin.</p>
<form id="f" autocomplete="off">
<label for="s">Şifre</label>
<input id="s" type="password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
<button id="b" type="submit">Aç</button>
<p id="msg" role="alert"></p>
</form>
<p id="ipucu">Şifre bu cihazda bir kez sorulur. Uygulamayı telefona kurmak için tarayıcı menüsünden "Ana ekrana ekle" seçeneğini kullanın. İlk açılıştan sonra internet olmadan da çalışır.</p>
</main>
<script>
(function(){
var K="sc1-anahtar",TUZ="mcjhYl1m2YiBK0f4M5rJzA==",TUR=600000,SURUM="lvl2jHl8oKDO";
var $=function(i){return document.getElementById(i)},S=window.crypto&&window.crypto.subtle;
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
function bin(s){var b=atob(s),u=new Uint8Array(b.length),i;for(i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function str(u){var s="",i;for(i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function lsGet(){try{return localStorage.getItem(K)}catch(e){return null}}
function lsSet(v){try{v==null?localStorage.removeItem(K):localStorage.setItem(K,v)}catch(e){}}
var veri=null;
function getir(){return veri?Promise.resolve(veri):fetch("icerik.bin").then(function(r){if(!r.ok)throw new Error("ag");return r.arrayBuffer()}).then(function(a){veri=new Uint8Array(a);return veri})}
function coz(raw){return getir().then(function(d){return S.importKey("raw",raw,"AES-GCM",false,["decrypt"]).then(function(k){return S.decrypt({name:"AES-GCM",iv:d.subarray(0,12)},k,d.subarray(12))})}).then(function(p){return new TextDecoder().decode(p)})}
function turet(pw){return S.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]).then(function(k){return S.deriveBits({name:"PBKDF2",salt:bin(TUZ),iterations:TUR,hash:"SHA-256"},k,256)}).then(function(b){return new Uint8Array(b)})}
function ac(html){document.open();document.write(html);document.close()}
function kilit(m){$("bekle").hidden=true;$("kilit").hidden=false;$("msg").textContent=m||"";$("b").disabled=false;$("b").textContent="Aç";try{$("s").focus()}catch(e){}}
function agHata(){return "İçerik indirilemedi. İnternete bağlıyken bir kez açın."}
if(!S){kilit("Bu tarayıcı uygulamayı açamıyor. Güncel bir tarayıcıyla ve https adresiyle deneyin.");$("b").disabled=true;return}
$("f").addEventListener("submit",function(e){
  e.preventDefault();var pw=$("s").value.trim();if(pw.normalize)pw=pw.normalize("NFC");if(!pw)return;
  $("b").disabled=true;$("b").textContent="Açılıyor…";$("msg").textContent="";
  getir().then(function(){return turet(pw)}).then(function(raw){return coz(raw).then(function(h){lsSet(str(raw));ac(h)},function(){kilit("Şifre yanlış.");$("s").select()})},function(){kilit(agHata())});
});
var kayit=lsGet();
if(kayit){var raw;try{raw=bin(kayit)}catch(e){raw=null}
  if(!raw)kilit();else getir().then(function(){return coz(raw).then(ac,function(){lsSet(null);kilit("Şifre değişti. Yeni şifreyi girin.")})},function(){kilit(agHata())})}
else kilit();
})();
</script>
</body></html>
